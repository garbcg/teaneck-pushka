<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#070c1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Chabad of Teaneck digital pushka — give tzedakah with a shake or tap. Demo only; no real charges." />
  <title>Chabad of Teaneck · Pushka</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app" id="app">
    <!-- Ambient background -->
    <div class="bg-glow" aria-hidden="true"></div>

    <!-- Top brand bar -->
    <header class="top-bar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><ellipse cx="12" cy="6.5" rx="7" ry="2.4" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5 6.5v11c0 1.3 3.1 2.4 7 2.4s7-1.1 7-2.4v-11" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M9.6 6.5h4.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </span>
        <div class="brand-text">
          <h1>Chabad of Teaneck</h1>
          <p class="tagline">Digital Pushka · צדקה</p>
        </div>
      </div>
      <button type="button" class="btn-ghost" id="btn-reset" title="Reset demo balance" aria-label="Reset demo balance">Reset</button>
    </header>

    <!-- Demo banner -->
    <div class="demo-banner" role="status">
      <span class="demo-dot"></span>
      Demo — not charged · no real payments yet
    </div>

    <!-- Main pushka stage -->
    <main class="stage" id="stage">
      <div class="feedback" id="feedback" aria-live="polite" hidden></div>

      <button type="button" class="pushka-hit" id="pushka-hit" aria-label="Give one dollar of tzedakah">
        <svg class="pushka" id="pushka" viewBox="0 -64 240 392" role="img" aria-hidden="true" focusable="false">
          <defs>
            <!-- Cylinder body: smoked navy glass -->
            <linearGradient id="g-glass" x1="0" x2="1" y1="0" y2="0">
              <stop offset="0" stop-color="#050a18"/>
              <stop offset="0.14" stop-color="#0e1a36"/>
              <stop offset="0.34" stop-color="#1b2a4f"/>
              <stop offset="0.58" stop-color="#132143"/>
              <stop offset="0.86" stop-color="#0a142b"/>
              <stop offset="1" stop-color="#040815"/>
            </linearGradient>
            <linearGradient id="g-glass-v" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0" stop-color="#000" stop-opacity="0.35"/>
              <stop offset="0.25" stop-color="#000" stop-opacity="0"/>
              <stop offset="0.8" stop-color="#000" stop-opacity="0"/>
              <stop offset="1" stop-color="#000" stop-opacity="0.3"/>
            </linearGradient>
            <!-- Specular reflections on the glass -->
            <linearGradient id="g-spec" x1="0" x2="1" y1="0" y2="0">
              <stop offset="0" stop-color="#fff" stop-opacity="0"/>
              <stop offset="0.21" stop-color="#fff" stop-opacity="0"/>
              <stop offset="0.25" stop-color="#fff" stop-opacity="0.16"/>
              <stop offset="0.27" stop-color="#fff" stop-opacity="0.07"/>
              <stop offset="0.33" stop-color="#fff" stop-opacity="0"/>
              <stop offset="0.8" stop-color="#fff" stop-opacity="0"/>
              <stop offset="0.88" stop-color="#fff" stop-opacity="0.05"/>
              <stop offset="0.93" stop-color="#fff" stop-opacity="0"/>
              <stop offset="0.975" stop-color="#e9d9b4" stop-opacity="0.22"/>
              <stop offset="1" stop-color="#e9d9b4" stop-opacity="0"/>
            </linearGradient>
            <!-- Brushed champagne metal -->
            <linearGradient id="g-metal" x1="0" x2="1" y1="0" y2="0">
              <stop offset="0" stop-color="#4d4130"/>
              <stop offset="0.08" stop-color="#8f7c5a"/>
              <stop offset="0.24" stop-color="#e9dbb9"/>
              <stop offset="0.3" stop-color="#f7eedb"/>
              <stop offset="0.42" stop-color="#bba57b"/>
              <stop offset="0.62" stop-color="#8b7753"/>
              <stop offset="0.82" stop-color="#c9b48b"/>
              <stop offset="0.94" stop-color="#6f5f43"/>
              <stop offset="1" stop-color="#3e3427"/>
            </linearGradient>
            <linearGradient id="g-metal-shade" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0" stop-color="#fff" stop-opacity="0.18"/>
              <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
              <stop offset="1" stop-color="#000" stop-opacity="0.28"/>
            </linearGradient>
            <radialGradient id="g-lid-top" cx="0.38" cy="0.3" r="0.85">
              <stop offset="0" stop-color="#fbf4e4"/>
              <stop offset="0.35" stop-color="#e2d1ab"/>
              <stop offset="0.75" stop-color="#b19a6f"/>
              <stop offset="1" stop-color="#8a7552"/>
            </radialGradient>
            <linearGradient id="g-slot" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0" stop-color="#0b0804"/>
              <stop offset="0.7" stop-color="#21190f"/>
              <stop offset="1" stop-color="#3a2e1d"/>
            </linearGradient>
            <!-- Liquid gold -->
            <linearGradient id="g-gold" x1="0" x2="1" y1="0" y2="0">
              <stop offset="0" stop-color="#5a3c12"/>
              <stop offset="0.12" stop-color="#94692a"/>
              <stop offset="0.27" stop-color="#e2b866"/>
              <stop offset="0.31" stop-color="#f3d593"/>
              <stop offset="0.45" stop-color="#c9973f"/>
              <stop offset="0.75" stop-color="#a2742c"/>
              <stop offset="0.92" stop-color="#6e4c1a"/>
              <stop offset="1" stop-color="#4a3210"/>
            </linearGradient>
            <linearGradient id="g-gold-depth" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0" stop-color="#2a1a05" stop-opacity="0.35"/>
              <stop offset="0.06" stop-color="#2a1a05" stop-opacity="0"/>
              <stop offset="0.7" stop-color="#2a1a05" stop-opacity="0.12"/>
              <stop offset="1" stop-color="#1a1003" stop-opacity="0.45"/>
            </linearGradient>
            <radialGradient id="g-gold-top" cx="0.42" cy="0.4" r="0.7">
              <stop offset="0" stop-color="#fbe7b5"/>
              <stop offset="0.5" stop-color="#e2b866"/>
              <stop offset="1" stop-color="#a87a30"/>
            </radialGradient>
            <filter id="f-soft" x="-30%" y="-100%" width="160%" height="300%">
              <feGaussianBlur stdDeviation="9"/>
            </filter>
            <filter id="f-contact" x="-20%" y="-100%" width="140%" height="300%">
              <feGaussianBlur stdDeviation="2.5"/>
            </filter>
            <clipPath id="clip-body">
              <path d="M24 40 V286 A96 18 0 0 0 216 286 V40 Z"/>
            </clipPath>
            <clipPath id="clip-liquid">
              <rect id="liquid-clip-rect" x="0" y="286" width="240" height="60"/>
              <ellipse id="liquid-clip-top" cx="120" cy="286" rx="96" ry="18"/>
            </clipPath>
            <clipPath id="clip-slot">
              <rect x="0" y="-120" width="240" height="160"/>
            </clipPath>
            <!-- Body lettering: edit the word once, here -->
            <g id="label" text-anchor="middle">
              <text class="lbl-hebrew" x="120" y="130" lang="he">צדקה</text>
              <rect x="108" y="142" width="24" height="0.8" opacity="0.6"/>
              <text class="lbl-word" id="box-word" x="120" y="186">Tzedakah</text>
              <text class="lbl-house" x="120" y="214">CHABAD OF TEANECK</text>
            </g>
          </defs>

          <!-- Floor shadows -->
          <ellipse cx="120" cy="306" rx="104" ry="15" fill="#000" opacity="0.55" filter="url(#f-soft)"/>
          <ellipse cx="120" cy="301" rx="92" ry="9" fill="#000" opacity="0.6" filter="url(#f-contact)"/>

          <!-- Body -->
          <path d="M24 40 V300 A96 18 0 0 0 216 300 V40 Z" fill="url(#g-glass)"/>

          <!-- Liquid gold level -->
          <g clip-path="url(#clip-body)">
            <g id="fill" class="liquid" opacity="0">
              <rect id="liquid-body" x="0" y="286" width="240" height="60" fill="url(#g-gold)"/>
              <rect id="liquid-depth" x="0" y="286" width="240" height="60" fill="url(#g-gold-depth)"/>
              <ellipse id="liquid-top" cx="120" cy="286" rx="96" ry="18" fill="url(#g-gold-top)"/>
              <ellipse id="liquid-meniscus" cx="120" cy="286" rx="95" ry="17.4" fill="none" stroke="#fff3d1" stroke-opacity="0.45" stroke-width="0.8"/>
            </g>
          </g>

          <path d="M24 40 V300 A96 18 0 0 0 216 300 V40 Z" fill="url(#g-glass)" opacity="0.14"/>
          <path d="M24 40 V300 A96 18 0 0 0 216 300 V40 Z" fill="url(#g-glass-v)"/>

          <!-- Lettering: light on glass, engraved-dark where gold sits behind -->
          <use href="#label" class="label-light"/>
          <use href="#label" class="label-dark" clip-path="url(#clip-liquid)"/>

          <!-- Glass reflections -->
          <path d="M24 40 V300 A96 18 0 0 0 216 300 V40 Z" fill="url(#g-spec)" pointer-events="none"/>

          <!-- Base ring -->
          <path d="M23 284 V300 A97 18 0 0 0 217 300 V284 A97 18 0 0 1 23 284 Z" fill="url(#g-metal)"/>
          <path d="M23 284 V300 A97 18 0 0 0 217 300 V284 A97 18 0 0 1 23 284 Z" fill="url(#g-metal-shade)"/>
          <path d="M23 284 A97 18 0 0 0 217 284" fill="none" stroke="#fff6e0" stroke-opacity="0.35" stroke-width="0.7"/>

          <!-- Lid ring -->
          <path d="M22 40 V54 A98 18 0 0 0 218 54 V40 Z" fill="url(#g-metal)"/>
          <path d="M22 40 V54 A98 18 0 0 0 218 54 V40 Z" fill="url(#g-metal-shade)"/>
          <path d="M22 54 A98 18 0 0 0 218 54" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="1"/>

          <!-- Lid top -->
          <ellipse cx="120" cy="40" rx="98" ry="18" fill="url(#g-lid-top)"/>
          <ellipse cx="120" cy="40" rx="86" ry="15.2" fill="none" stroke="#000" stroke-opacity="0.12" stroke-width="0.8"/>
          <ellipse cx="120" cy="40.8" rx="86" ry="15.2" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="0.6"/>

          <!-- Coin slot -->
          <rect x="84" y="36.4" width="72" height="7.6" rx="3.8" fill="#fff8e6" opacity="0.55" transform="translate(0 1)"/>
          <rect x="84" y="36.4" width="72" height="7.2" rx="3.6" fill="url(#g-slot)"/>
          <rect x="86" y="37" width="68" height="1.4" rx="0.7" fill="#000" opacity="0.6"/>

          <!-- Coins drop in here (spawned by app.js) -->
          <g id="coin-layer" clip-path="url(#clip-slot)"></g>
        </svg>
      </button>

      <p class="hint" id="hint">
        Tap the pushka · press <kbd>Space</kbd> · or shake your phone
      </p>
    </main>

    <!-- Stats footer -->
    <footer class="stats">
      <div class="stat">
        <span class="stat-label">Given</span>
        <span class="stat-value" id="stat-given">$0</span>
      </div>
      <div class="stat goal">
        <span class="stat-label">Toward goal</span>
        <span class="stat-value"><span id="stat-fill">$0</span> / <span id="stat-goal">$36</span></span>
        <div class="mini-bar" aria-hidden="true"><div class="mini-bar-fill" id="mini-fill"></div></div>
      </div>
      <div class="stat">
        <span class="stat-label">This session</span>
        <span class="stat-value" id="stat-session">$0</span>
      </div>
    </footer>

    <!-- Motion permission (iOS) -->
    <div class="sheet" id="motion-sheet" hidden>
      <div class="sheet-card">
        <h2>Enable shake to give?</h2>
        <p>Allow motion access so shaking your phone drops a dollar into the pushka.</p>
        <div class="sheet-actions">
          <button type="button" class="btn-secondary" id="motion-skip">Not now</button>
          <button type="button" class="btn-primary" id="motion-enable">Enable shake</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
